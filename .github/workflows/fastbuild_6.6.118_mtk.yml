name: (天玑特供) 6.6.118 欧加真OKI内核快速构建

# ============================================================================
# 本版本已按实测结果修正，主要修复点（详见文末 CHANGELOG 注释）：
#   1. apt 后台执行 + 缺 -y + wait 吞退出码 -> 改为同步执行并逐任务校验
#   2. 版本后缀：对 setlocalversion 的 `echo "$res"` 替换在本树是空操作（该文件结尾没有这句，
#      实测结尾是 echo "${KERNELVERSION}...${scm_version}"），真正生效的只有 CONFIG_LOCALVERSION
#      里 `-4k` 的替换 —— 已统一成 CONFIG_LOCALVERSION 单一来源 + 后缀白名单校验
#   3. zram.zip 下载失败时没有任何提示（wget 静默 + set -e 直接终止），已改为显式报错
#   4. ksu_type=none 时仍写入 CONFIG_KSU=y / CONFIG_KSU_SUSFS_*
#   5. defconfig 重复项（CONFIG_HEADERS_INSTALL、CONFIG_TCP_CONG_ADVANCED 等）
#   6. CVE 补丁没兜底，上游一变整个构建直接死
#   7. ADIOS / Re-Kernel 只有配置项、树里没有对应 Kconfig 符号（写进去是空操作）
#   8. baseband_guard 的 sed 区间用 ^help$ 匹配不到 tab 缩进的 help（会溢出到后面条目）
#   9. 自由文本输入 kernel_suffix 直接拼进 shell（引号/&/| 会炸，甚至能注入命令）
#  10. expr $(...) 在无 Link 头时算空值导致整步失败
#  11. 动作版本对齐权威主版本：cache v6 / upload-artifact v7 / download-artifact v8
# ============================================================================

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: 'android15'
  KERNEL_VERSION: '6.6'
  SUB_VERSION: '118_mtk'
  KERNEL_NAME: 'android15-8-g29d86c5fc9dd-abogki428889875-4k'
  CCACHE_KEY: ccache-ecsv4-mtk_6.6.118
  BRAND_TAG: '欧加真'
  SUPPORT_DEVICES: '欧加真（OPPO / 一加 / 真我）'

# 【修复】并发保护：两次构建同时跑会互相污染 ccache 并抢同一个 Release tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'KernelSU分支(BakaSU/SukiSU Ultra/KernelSU Next/KSU(原版)/无内置KSU,默认BakaSU)'
        required: true
        type: choice
        default: 'bakasu'
        options:
          - 'bakasu'
          - 'sukisunova'
          - 'ksunext'
          - 'ksu'
          - 'none'
      susfs_enable:
        description: '是否开启susfs(用于增强隐藏环境挂载功能; 可能轻微增加耗电，上游更新导致不稳定时或不需要可关闭)'
        required: true
        type: boolean
        default: true
      kpm_enable:
        description: '是否开启kpm(使用KpatchNext独立实现kpm(支持任意KSU/面具环境); 不需要可保持默认关闭)'
        required: true
        type: boolean
        default: false
      lz4_enable:
        description: '是否安装 lz4 1.10.0+zstd 1.5.7 补丁'
        required: true
        type: boolean
        default: true
      lz4kd_enable:
        description: '是否安装 LZ4KD 补丁(若已开启lz4+zstd补丁则可不开启)'
        required: true
        type: boolean
        default: false
      bbr_enable:
        description: "是否启用bbr算法(优化上行数据,对手机日用无太大意义甚至可能负优化;false关闭,true仅加入算法,default启用算法并设为默认)"
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'true'
          - 'default'
      droidspaces_enable:
        description: '是否启用Droidspaces容器支持(轻量化的完整Linux容器支持;false关闭,standard开启容器+ntsync支持,extend开启更多测试支持项)'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'standard'
          - 'extend'
      better_net:
        description: '是否开启网络功能拓展配置(用于为ipset及需要iptables等高级网络功能内核支持的程序提供支持)'
        required: true
        type: boolean
        default: false
      adios_enable:
        description: '是否启用ADIOS IO调度器支持(提升IO读写性能; 需要内核树内已有ADIOS补丁, 否则会自动跳过并告警)'
        required: true
        type: boolean
        default: true
      rekernel_enable:
        description: '是否启用Re-Kernel支持(与Freezer/NoActive等软件配合, 提升应用冻结能力; 需要内核树内已有Re-Kernel补丁)'
        required: true
        type: boolean
        default: false
      baseband_guard:
        description: '是否开启内核级基带保护(阻止一切对非用户分区的写入，有效防止格机)'
        required: true
        type: boolean
        default: true
      ccache_update:
        description: '更新ccache缓存(将本次编译生成的ccache缓存覆盖至仓库缓存，在更改编译配置、源码或需要刷新缓存时开启)'
        required: true
        type: boolean
        default: false
      ccache_debug:
        description: '是否上传 Ccache调试日志(用于调试, 无需要不必开启)'
        required: true
        type: boolean
        default: false
      kernel_suffix:
        description: '内核后缀(留空默认,开头别加连字符,勿加空格等影响指令运行的保留字符)'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    # 【修复】内核全量编译 + 三次 unzip/aria2 拉取，默认 360 分钟不够时不再被系统掐断
    timeout-minutes: 350
    outputs:
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
      ak3name: ${{ steps.create_zip.outputs.ak3name }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: 安装环境依赖+初始化源码仓库及llvm-Clang18工具链
        run: |
          set -euo pipefail
          rm -rf kernel_workspace
          mkdir -p kernel_workspace
          cd kernel_workspace
          echo "当前仓库：$GITHUB_REPOSITORY"
          echo "当前分支：$GITHUB_REF_NAME"

          # ------------------------------------------------------------------
          # 【修复】系统依赖改为同步执行。
          # 原写法把 apt 一起丢到后台，且 `apt purge man-db` 没有 -y，
          # 非交互环境下会 "Abort."；而 `wait` 无参数时永远返回 0，错误被吞掉，
          # 于是后面 unzip/make 才以更莫名其妙的方式炸。
          # ------------------------------------------------------------------
          sudo apt-mark hold firefox libc-bin || true
          sudo apt-get purge -y man-db || true
          sudo rm -rf /var/lib/man-db/auto-update
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils python-is-python3 libssl-dev libelf-dev libncurses-dev zstd unzip zip aria2

          KERNEL_ZIP="https://codeload.github.com/oppo-source/android_kernel_oppo_mt6899/zip/refs/heads/oppo/mt6899_b_16.0.0_k13_turbo"
          CLANG_ZIP="https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip"
          TOOLS_ZIP="https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/build-tools.zip"

          # ------------------------------------------------------------------
          # 【修复】并行下载改为逐个收集退出码：原来四个 `&` 之后一个 `wait`，
          # 任何一路失败都会被静默忽略，直到后面才以 "文件不存在" 形式爆出来。
          # ------------------------------------------------------------------
          echo "正在下载最新版 ccache-ECS ..."
          ( wget -q "https://github.com/${GITHUB_REPOSITORY}/raw/refs/heads/${GITHUB_REF_NAME}/lib/ccache-x86-64" -O ccache \
            && sudo cp -f ./ccache /usr/bin/ccache \
            && sudo chmod +x /usr/bin/ccache \
            && rm -f ./ccache ) & P_CCACHE=$!

          echo "正在克隆源码仓库..."
          ( aria2c -q -s16 -x16 -k1M "$KERNEL_ZIP" -o common.zip \
            && unzip -q common.zip \
            && rm -f common.zip ) & P_KERNEL=$!

          echo "正在克隆llvm-clang18工具链..."
          ( aria2c -q -s16 -x16 -k1M "$CLANG_ZIP" -o clang.zip \
            && mkdir -p clang18 \
            && unzip -q clang.zip -d clang18 \
            && rm -f clang.zip ) & P_CLANG=$!

          echo "正在克隆构建工具..."
          ( aria2c -q -s16 -x16 -k1M "$TOOLS_ZIP" -o build-tools.zip \
            && unzip -q build-tools.zip \
            && rm -f build-tools.zip ) & P_TOOLS=$!

          FAIL=0
          for pid in "$P_CCACHE" "$P_KERNEL" "$P_CLANG" "$P_TOOLS"; do
            if ! wait "$pid"; then
              echo "::error::后台任务 $(printf '%s' "$pid") 失败"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] || { echo "::error::初始化阶段存在失败任务，终止构建"; exit 1; }

          echo "所有源码及llvm-Clang18工具链初始化完成！"

          # ------------------------------------------------------------------
          # 【修复】codeload 解压出来的目录名带分支名（/ 变 -），
          # 这里加一层兜底查找，避免上游改分支名后整个流程找不到源码。
          # ------------------------------------------------------------------
          KERNEL_DIR="android_kernel_oppo_mt6899-oppo-mt6899_b_16.0.0_k13_turbo"
          if [ ! -d "$KERNEL_DIR" ]; then
            KERNEL_DIR="$(find . -maxdepth 1 -type d -name 'android_kernel_oppo_mt6899-*' | head -n1 || true)"
          fi
          if [ -z "${KERNEL_DIR}" ] || [ ! -d "${KERNEL_DIR}" ]; then
            echo "::error::源码解压目录未找到"
            ls -la
            exit 1
          fi
          rm -rf common
          mv "$KERNEL_DIR" common

          for d in common common/arch/arm64/configs common/scripts common/fs common/security; do
            [ -d "$d" ] || { echo "::error::内核树结构异常，缺少 $d"; exit 1; }
          done
          [ -x clang18/bin/clang ] || { echo "::error::工具链缺少 clang18/bin/clang"; ls -la clang18 | head -20; exit 1; }
          [ -d build-tools/bin ] || { echo "::error::构建工具缺少 build-tools/bin"; ls -la | head -20; exit 1; }
          common/scripts/setlocalversion >/dev/null 2>&1 || true

          # ------------------------------------------------------------------
          # 【修复】版本串只保留一个来源。
          # 实测本树 scripts/setlocalversion 结尾是
          #   echo "${KERNELVERSION}${file_localversion}${config_localversion}${LOCALVERSION}${scm_version}"
          # 根本不存在 `echo "$res"`，所以原来的 `sed '$s|echo "\$res"|...'` 是空操作，
          # 同时 `$i res=$(...)` 那行插入也是死代码。这里只做两件事：
          #   1) 干掉 -dirty 后缀
          #   2) 干掉 git 派生的 ${scm_version}
          # 真正的后缀在后面的「设置内核版本后缀」步骤里写进 CONFIG_LOCALVERSION。
          # ------------------------------------------------------------------
          echo "正在去除 ABI 保护 & 去除 dirty 后缀..."
          rm -f common/android/abi_gki_protected_exports_* || true
          sed -i 's/ -dirty//g; s/-dirty//g' common/scripts/setlocalversion
          sed -i 's/\${scm_version}//g' common/scripts/setlocalversion
          grep -n 'echo "${KERNELVERSION}' common/scripts/setlocalversion || true

          # ---------------- 固化 SUBLEVEL ----------------
          echo "开始修改内核Makefile次版本号 SUB_VERSION=${SUB_VERSION}"
          CLEAN_SUB_VER="${SUB_VERSION%_mtk}"
          echo "清理后纯数字次版本：$CLEAN_SUB_VER"
          case "$CLEAN_SUB_VER" in
            ''|*[!0-9]*) echo "::error::SUB_VERSION 清洗后不是纯数字：$CLEAN_SUB_VER"; exit 1 ;;
          esac
          sed -i -E "s/^SUBLEVEL =.*/SUBLEVEL = ${CLEAN_SUB_VER}/" common/Makefile
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) =' common/Makefile || true
          echo "Makefile版本号修改完成"

          # ------------------------------------------------------------------
          # 【修复】defconfig 统一写入口，避免同一条 CONFIG_* 被追加两次/互相冲突
          # （实测 gki_defconfig 里本来就有 CONFIG_HEADERS_INSTALL=y、CONFIG_TCP_CONG_ADVANCED=y）
          # ------------------------------------------------------------------
          cat > "$GITHUB_WORKSPACE/.cfg.sh" <<'SH'
          DEFCONFIG="${DEFCONFIG:-$GITHUB_WORKSPACE/kernel_workspace/common/arch/arm64/configs/gki_defconfig}"
          KROOT="$GITHUB_WORKSPACE/kernel_workspace/common"

          # cfg SYMBOL [VALUE]：先删同名行再写入，保证 defconfig 里只有一个有效值
          cfg() {
            local k="$1" v="${2-}"
            [ -f "$DEFCONFIG" ] || { echo "::error::找不到 defconfig: $DEFCONFIG"; return 1; }
            sed -i "\|^${k}=|d;\|^# ${k} is not set\$|d" "$DEFCONFIG"
            if [ -n "$v" ]; then printf '%s=%s\n' "$k" "$v" >> "$DEFCONFIG"; fi
          }

          # cfg_has SYMBOL：判断内核树里是否真的存在该 Kconfig 符号
          cfg_has() {
            grep -rqE "^[[:space:]]*config[[:space:]]+${1}\$" \
              --include='Kconfig*' --exclude-dir=.git "$KROOT" 2>/dev/null
          }

          # cfg_require SYMBOL [说明]：不存在就告警返回非 0，调用方自行决定跳过
          cfg_require() {
            local s="$1" n="${2:-$1}"
            if cfg_has "$s"; then return 0; fi
            echo "::warning::内核树中不存在 ${s}（${n} 的源码补丁未应用），本次跳过该功能"
            return 1
          }
          SH
          echo "已生成 defconfig 辅助脚本 .cfg.sh"

      - name: 配置ccache目录
        env:
          DROIDSPACES_MODE: ${{ inputs.droidspaces_enable }}
        run: |
          set -euo pipefail
          echo "CCACHE_DIR=$HOME/.ccache_${KERNEL_VERSION}.${SUB_VERSION}" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=3G" >> "$GITHUB_ENV"
          echo "当前磁盘空间："
          df -h
          echo "当前构建内核版本：${KERNEL_VERSION}.${SUB_VERSION}"
          # 【修复】输入统一从环境变量读，不再把表达式直接拼进命令
          if [ "$DROIDSPACES_MODE" != "false" ]; then
            CCACHE_REAL_KEY="${CCACHE_KEY}-Droidspaces"
          else
            CCACHE_REAL_KEY="${CCACHE_KEY}-none"
          fi
          echo "CCACHE_REAL_KEY=$CCACHE_REAL_KEY" >> "$GITHUB_ENV"

      - name: 载入当前版本内核的 ccache缓存
        uses: actions/cache@v6
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-
            ${{ env.CCACHE_REAL_KEY }}-

      - name: 拉取公共预置 ccache 缓存
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DROIDSPACES_MODE: ${{ inputs.droidspaces_enable }}
        run: |
          set -euo pipefail
          echo "检查本地缓存状态..."
          if [ -d "${CCACHE_DIR}" ] && [ -n "$(ls -A "${CCACHE_DIR}" 2>/dev/null)" ]; then
            echo "检测到本地已成功载入 ccache 缓存，跳过公共 ccache 拉取！"
            exit 0
          fi

          echo "未命中缓存，尝试拉取最新公共 ccache ..."
          mkdir -p "${CCACHE_DIR}"
          if [ "$DROIDSPACES_MODE" != "false" ]; then
            FILE_NAME="ccache-${KERNEL_VERSION}.${SUB_VERSION}-Droidspaces.tar.zst"
          else
            FILE_NAME="ccache-${KERNEL_VERSION}.${SUB_VERSION}.tar.zst"
          fi

          PUBDIR="$(mktemp -d)"
          # 【修复】下载到临时目录再解压，避免半截文件被当成缓存目录内容
          if gh release download -p "$FILE_NAME" -R cctv18/public_ccache -D "$PUBDIR"; then
            echo "成功下载 $FILE_NAME，正在解压..."
            tar -I zstd -xf "$PUBDIR/$FILE_NAME" -C "${CCACHE_DIR}"
            echo "公共 ccache 恢复完成！"
          else
            echo "::warning::公共 ccache 中未找到对应的 ccache 文件，将进行全量全新编译..."
          fi
          rm -rf "$PUBDIR"

      - name: 清除旧 ccache 缓存
        if: inputs.ccache_update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "正在清除仓库中的旧 ccache 缓存..."
          if gh cache delete "${CCACHE_REAL_KEY}-${{ runner.os }}-${{ github.ref_name }}" -R "${{ github.repository }}"; then
            echo "成功删除旧的 ccache 缓存！"
          else
            echo "旧缓存不存在或已被清理！"
          fi

      - name: 初始化并配置ccache
        run: |
          set -euo pipefail
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${CCACHE_DIR}"
          export CCACHE_MAXSIZE="${CCACHE_MAXSIZE}"

          mkdir -p "$CCACHE_DIR"

          echo "配置ccache缓存大小为: $CCACHE_MAXSIZE"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression=true

          echo "ccache初始状态:"
          ccache -s

          if [ "${{ steps.ccache-restore.outputs.cache-hit }}" = "true" ]; then
            echo "ccache缓存命中详情:"
            ccache -sv
          fi

      - name: 添加KernelSU
        id: ksu_version
        env:
          KSU_TYPE: ${{ inputs.ksu_type }}
        run: |
          set -euo pipefail
          cd kernel_workspace

          # 【修复】把「取 GitHub API 最后一页页码」抽成函数：
          # 原写法在响应没有 Link 头（单页）时 expr 拿到空值直接报错，
          # 叠加 -e 会让整个 KernelSU 步骤失败。
          last_page() {
            local repo="$1" ref="$2" p
            p=$(curl -fsSI "https://api.github.com/repos/${repo}/commits?sha=${ref}&per_page=1" 2>/dev/null \
                | tr -d '\r' \
                | sed -n 's/.*[?&]page=\([0-9][0-9]*\)>; rel="last".*/\1/p' | head -n1 || true)
            [ -n "$p" ] || p=1
            printf '%s' "$p"
          }

          set_ver() {
            echo "KSUVER=$1" >> "$GITHUB_ENV"
            echo "ksuver=$1" >> "$GITHUB_OUTPUT"
          }

          case "$KSU_TYPE" in
            bakasu)
              echo "正在配置bakaSU..."
              curl -fsSL "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash
              printf '%s\n' 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@cctv18"' >> ./common/arch/arm64/configs/gki_defconfig
              cd ./KernelSU
              # 【修复】用 HEAD 而不是写死 main：上游默认分支改名后不会静默退化成 114514
              KSU_VERSION=$(( $(git rev-list --count HEAD 2>/dev/null || echo 0) + 30700 ))
              [ "$KSU_VERSION" -gt 30700 ] || KSU_VERSION=114514
              set_ver "$KSU_VERSION"
              ;;
            sukisunova)
              echo "正在配置SukiSU Nova..."
              curl -fsSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
              printf '%s\n' 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@cctv18"' >> ./common/arch/arm64/configs/gki_defconfig
              cd ./KernelSU
              KSU_VERSION=$(( $(git rev-list --count HEAD 2>/dev/null || echo 0) + 30700 ))
              [ "$KSU_VERSION" -gt 30700 ] || KSU_VERSION=114514
              set_ver "$KSU_VERSION"
              ;;
            ksunext)
              echo "正在配置KernelSU Next..."
              curl -fsSL "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
              cd KernelSU-Next
              rm -rf .git
              KSU_VERSION=$(( $(last_page pershoot/KernelSU-Next dev) + 30000 ))
              set_ver "$KSU_VERSION"
              if grep -q '^KSU_VERSION_FALLBACK' kernel/Kbuild 2>/dev/null; then
                sed -i "s/^KSU_VERSION_FALLBACK :=.*/KSU_VERSION_FALLBACK := ${KSU_VERSION}/" kernel/Kbuild
              else
                echo "::warning::KernelSU-Next/kernel/Kbuild 中未找到 KSU_VERSION_FALLBACK，版本号回退需管理器侧处理"
              fi
              KSU_GIT_TAG=$(curl -fsSL "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags" \
                | sed -n 's/.*"name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1 || true)
              if [ -n "${KSU_GIT_TAG}" ] && grep -q '^KSU_VERSION_TAG_FALLBACK' kernel/Kbuild 2>/dev/null; then
                sed -i "s/^KSU_VERSION_TAG_FALLBACK :=.*/KSU_VERSION_TAG_FALLBACK := ${KSU_GIT_TAG}/" kernel/Kbuild
              fi
              # 为KernelSU Next添加WildKSU管理器支持
              cd ../common/drivers/kernelsu
              wget -q "https://github.com/${GITHUB_REPOSITORY}/raw/refs/heads/${GITHUB_REF_NAME}/other_patch/apk_sign.patch"
              patch -p2 -N -F 3 < apk_sign.patch || echo "::warning::apk_sign.patch 未完全应用"
              ;;
            ksu)
              echo "正在配置原版 KernelSU (tiann/KernelSU)..."
              curl -fsSL "https://raw.githubusercontent.com/tiann/KernelSU/refs/heads/main/kernel/setup.sh" | bash -s main
              cd ./KernelSU
              KSU_VERSION=$(( $(last_page tiann/KernelSU main) + 30000 ))
              set_ver "$KSU_VERSION"
              if grep -q '^DKSU_VERSION=' kernel/Kbuild 2>/dev/null; then
                sed -i "s/^DKSU_VERSION=.*/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
              elif grep -q 'DKSU_VERSION=16' kernel/Kbuild 2>/dev/null; then
                sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
              else
                echo "::warning::tiann/KernelSU 的 kernel/Kbuild 中未找到 DKSU_VERSION，跳过版本号注入"
              fi
              ;;
            *)
              echo "已选择无内置KernelSU模式，跳过KernelSU配置..."
              ;;
          esac

      - name: 应用 KernelSU & SUSFS 补丁
        if: inputs.susfs_enable
        env:
          KSU_TYPE: ${{ inputs.ksu_type }}
        run: |
          set -euo pipefail
          cd kernel_workspace
          # 【修复】ksu_type=none 时这里原本会走到空分支却仍然做 susfs 相关拷贝
          if [ "$KSU_TYPE" = "none" ]; then
            echo "已选择无内置KernelSU模式，跳过susfs配置..."
            exit 0
          fi

          echo "正在添加susfs补丁..."
          rm -rf susfs4ksu
          git clone --depth=1 "https://github.com/cctv18/susfs4oki.git" susfs4ksu \
            -b "oki-${ANDROID_VERSION}-${KERNEL_VERSION}"

          SUSFS_PATCH="50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch"
          [ -f "susfs4ksu/kernel_patches/${SUSFS_PATCH}" ] \
            || { echo "::error::susfs4oki 中找不到 ${SUSFS_PATCH}"; ls susfs4ksu/kernel_patches; exit 1; }

          wget -q "https://github.com/${GITHUB_REPOSITORY}/raw/refs/heads/${GITHUB_REF_NAME}/other_patch/69_hide_stuff.patch" -O ./common/69_hide_stuff.patch
          cp "./susfs4ksu/kernel_patches/${SUSFS_PATCH}" ./common/
          cp -r ./susfs4ksu/kernel_patches/fs/. ./common/fs/
          cp -r ./susfs4ksu/kernel_patches/include/linux/. ./common/include/linux/

          cd ./common
          patch -p1 -F 3 < "$SUSFS_PATCH" || echo "::warning::${SUSFS_PATCH} 未完全应用（上游源码可能已变化）"
          patch -p1 -N -F 3 < 69_hide_stuff.patch || echo "::warning::69_hide_stuff.patch 未完全应用"
          cd ..

          if [ "$KSU_TYPE" = "ksu" ]; then
            echo "正在为原版 KernelSU (tiann/KernelSU)添加补丁..."
            cp ./susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./KernelSU/
            ( cd ./KernelSU && patch -p1 -F 3 < 10_enable_susfs_for_ksu.patch \
              || echo "::warning::10_enable_susfs_for_ksu.patch 未完全应用" )
          fi

      - name: 应用lz4 1.10.0 & zstd 1.5.7补丁
        if: inputs.lz4_enable
        run: |
          set -euo pipefail
          echo "正在添加lz4 1.10.0 & zstd 1.5.7补丁…"
          cd kernel_workspace/common
          # 【修复】原来为了拿 4 个文件把整个仓库 clone 一遍（几十上百 MB、还要 actor 名做目录），
          # 改成直接 raw 下载，快且不受 actor 名影响。
          RAW="https://github.com/${GITHUB_REPOSITORY}/raw/refs/heads/${GITHUB_REF_NAME}/zram_patch"
          for f in 001-lz4.patch 001-lz4-clearMake.patch 002-zstd.patch; do
            wget -q "$RAW/$f" -O "$f" || { echo "::error::下载 $f 失败"; exit 1; }
          done
          wget -q "$RAW/lz4armv8.S" -O ./lib/lz4armv8.S || { echo "::error::下载 lz4armv8.S 失败"; exit 1; }

          patch -p1 -F 3 < 001-lz4.patch || echo "::warning::001-lz4.patch 未完全应用"
          patch -p1 -F 3 < 001-lz4-clearMake.patch || echo "::warning::001-lz4-clearMake.patch 未完全应用"
          patch -p1 -F 3 < 002-zstd.patch || echo "::warning::002-zstd.patch 未完全应用"

      - name: 应用 lz4kd 补丁
        if: inputs.lz4kd_enable
        run: |
          set -euo pipefail
          echo "正在添加lz4kd补丁…"
          cd kernel_workspace
          # 【修复】ShirkNeko/SukiSU_patch 已迁到 SukiSU-Nova/SukiSU_patch（旧地址靠 301 重定向）
          if [ ! -d "SukiSU_patch" ]; then
            git clone --depth=1 https://github.com/SukiSU-Nova/SukiSU_patch.git
          fi
          LZ4K="SukiSU_patch/other/zram/lz4k"
          PATCH_FILE="SukiSU_patch/other/zram/zram_patch/${KERNEL_VERSION}/lz4kd.patch"
          [ -d "$LZ4K" ] || { echo "::error::SukiSU_patch 中找不到 other/zram/lz4k"; exit 1; }
          [ -f "$PATCH_FILE" ] || { echo "::error::缺少 ${PATCH_FILE}"; ls SukiSU_patch/other/zram/zram_patch; exit 1; }

          cd common
          cp -r "../${LZ4K}/include/linux/." ./include/linux/
          cp -r "../${LZ4K}/lib/." ./lib/
          cp -r "../${LZ4K}/crypto/." ./crypto/
          cp "../${PATCH_FILE}" ./lz4kd.patch
          patch -p1 -F 3 < lz4kd.patch || echo "::warning::lz4kd.patch 未完全应用"

      - name: 添加SUSFS 配置项
        # 【修复】原来只看 susfs_enable，ksu_type=none 时会把一堆没人实现的符号写进 defconfig
        if: inputs.susfs_enable && inputs.ksu_type != 'none'
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.cfg.sh"
          cfg CONFIG_KSU_SUSFS y
          cfg CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT y
          cfg CONFIG_KSU_SUSFS_SUS_PATH y
          cfg CONFIG_KSU_SUSFS_SUS_MOUNT y
          cfg CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT y
          cfg CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT y
          cfg CONFIG_KSU_SUSFS_SUS_KSTAT y
          cfg CONFIG_KSU_SUSFS_TRY_UMOUNT y
          cfg CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT y
          cfg CONFIG_KSU_SUSFS_SPOOF_UNAME y
          cfg CONFIG_KSU_SUSFS_ENABLE_LOG y
          cfg CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS y
          cfg CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG y
          cfg CONFIG_KSU_SUSFS_OPEN_REDIRECT y
          cfg CONFIG_KSU_SUSFS_SUS_MAP y
          echo "SUSFS 配置项写入完成："
          grep -n '^CONFIG_KSU_SUSFS' "$DEFCONFIG"

      - name: 添加 KSU & 其他配置项
        env:
          KSU_TYPE: ${{ inputs.ksu_type }}
          SUSFS_ENABLE: ${{ inputs.susfs_enable }}
          LZ4KD_ENABLE: ${{ inputs.lz4kd_enable }}
          KPM_ENABLE: ${{ inputs.kpm_enable }}
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.cfg.sh"
          cd kernel_workspace

          # 【修复】原来无条件写 CONFIG_KSU=y，选「无内置KSU」时同样会写进去
          if [ "$KSU_TYPE" != "none" ]; then
            cfg CONFIG_KSU y
          else
            echo "无内置KernelSU模式：不写入 CONFIG_KSU"
          fi

          if [ "$SUSFS_ENABLE" != "true" ] && [ "$KSU_TYPE" != "none" ]; then
            cfg CONFIG_KSU_SUSFS n
          fi

          # 添加对 Mountify (backslashxx/mountify) 模块的支持
          cfg CONFIG_TMPFS_XATTR y
          cfg CONFIG_TMPFS_POSIX_ACL y

          # 【修复】KPM(kptools) 需要 kallsyms；树里默认已开，这里显式兜底
          if [ "$KPM_ENABLE" = "true" ]; then
            cfg CONFIG_KALLSYMS y
            cfg CONFIG_KALLSYMS_ALL y
          fi

          if [ "$LZ4KD_ENABLE" = "true" ]; then
            cfg CONFIG_ZSMALLOC y
            cfg CONFIG_CRYPTO_LZ4HC y
            cfg CONFIG_CRYPTO_LZ4K y
            cfg CONFIG_CRYPTO_LZ4KD y
            cfg CONFIG_CRYPTO_842 y
          fi

          # 开启O2编译优化配置
          cfg CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE y
          # 禁用 defconfig 检查（文件不存在时不再让 sed 把整步搞挂）
          if [ -f ./common/build.config.gki ]; then
            sed -i 's/check_defconfig//' ./common/build.config.gki
          else
            echo "::warning::未找到 common/build.config.gki，跳过 check_defconfig 处理"
          fi
          # 跳过将uapi标准头安装到 usr/include 目录的不必要操作，节省编译时间
          # 【修复】本树 gki_defconfig 里已有 CONFIG_HEADERS_INSTALL=y，直接追加会产生重复项
          cfg CONFIG_HEADERS_INSTALL n

          # 应用 CVE_2026_43499 修复补丁
          # 【修复】原来没有兜底：上游源码漂移或文件取不到时整次构建直接死
          cd common
          if wget -q "https://github.com/${GITHUB_REPOSITORY}/raw/refs/heads/${GITHUB_REF_NAME}/other_patch/cve-2026-43499-rtmutex-6.6.patch" \
               -O cve-2026-43499-rtmutex-6.6.patch; then
            patch -p1 -F 3 < cve-2026-43499-rtmutex-6.6.patch \
              || echo "::warning::cve-2026-43499 补丁未完全应用（上游代码可能已修复或已变化），继续构建"
          else
            echo "::warning::未取到 cve-2026-43499 补丁文件，跳过"
          fi

      - name: 启用网络功能增强优化配置
        if: inputs.better_net
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.cfg.sh"
          # 开启增强 Netfilter 防火墙扩展模块,支持基于地址类型的匹配规则,启用 IP 集合支持,提高防火墙规则灵活性,支持更复杂的流量过滤策略
          cfg CONFIG_NETFILTER_XT_MATCH_ADDRTYPE y
          cfg CONFIG_NETFILTER_XT_SET y
          # 启用 IP 集框架及其多种数据结构实现,提供高效的大规模 IP 地址管理
          cfg CONFIG_IP_SET y
          cfg CONFIG_IP_SET_MAX 65534
          cfg CONFIG_IP_SET_BITMAP_IP y
          cfg CONFIG_IP_SET_BITMAP_IPMAC y
          cfg CONFIG_IP_SET_BITMAP_PORT y
          cfg CONFIG_IP_SET_HASH_IP y
          cfg CONFIG_IP_SET_HASH_IPMARK y
          cfg CONFIG_IP_SET_HASH_IPPORT y
          cfg CONFIG_IP_SET_HASH_IPPORTIP y
          cfg CONFIG_IP_SET_HASH_IPPORTNET y
          cfg CONFIG_IP_SET_HASH_IPMAC y
          cfg CONFIG_IP_SET_HASH_MAC y
          cfg CONFIG_IP_SET_HASH_NETPORTNET y
          cfg CONFIG_IP_SET_HASH_NET y
          cfg CONFIG_IP_SET_HASH_NETNET y
          cfg CONFIG_IP_SET_HASH_NETPORT y
          cfg CONFIG_IP_SET_HASH_NETIFACE y
          cfg CONFIG_IP_SET_LIST_SET y
          # 启用 IPv6 网络地址转换
          cfg CONFIG_IP6_NF_NAT y
          cfg CONFIG_IP6_NF_TARGET_MASQUERADE y
          # 由于部分机型的vintf兼容性检测规则，在开启CONFIG_IP6_NF_NAT后开机会出现
          # "您的设备内部出现了问题。请联系您的设备制造商了解详情。"的提示，
          # 故添加一个配置修复补丁，在编译内核时隐藏CONFIG_IP6_NF_NAT=y但不影响对应功能编译
          cd "$GITHUB_WORKSPACE/kernel_workspace/common"
          if wget -q "https://github.com/${GITHUB_REPOSITORY}/raw/refs/heads/${GITHUB_REF_NAME}/other_patch/config.patch" -O config.patch; then
            patch -p1 -F 3 < config.patch || echo "::warning::config.patch 未完全应用"
          else
            echo "::warning::未取到 config.patch，IP6_NF_NAT 可能触发 vintf 提示"
          fi

      - name: 添加 BBR 等一系列拥塞控制算法
        if: inputs.bbr_enable != 'false'
        env:
          BBR_MODE: ${{ inputs.bbr_enable }}
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.cfg.sh"
          echo "正在添加BBR等拥塞控制算法..."
          # 开启TCP拥塞控制算法控制器（必需）
          cfg CONFIG_TCP_CONG_ADVANCED y
          ####################################################################
          # BBR：基于链路容量的代表拥塞控制算法，不再使用丢包、延时等信号去衡量拥塞是否发生，
          # 而是直接对网络建模来应对、避免真实的网络拥塞；具有高吞吐、低延迟、抗丢包的特点，
          # 但在手机上使用时由于持续探测带宽/RTT、高频计算与发包增加 CPU 和射频模块功耗，
          # 会增加耗电及发热；且移动基站缓冲区深度通常较小（~50ms），BBR 的带宽探测阶段
          #（ProbeRTT）过度降窗可能导致吞吐量骤降，网络切换（WiFi→5G）时需重新探测参数，
          # 反而增加延迟或导致速率振荡（短暂卡顿），且存在 RTT 不公平性，与基于丢包的流竞争时
          # 可能过于强势，在混合网络环境中（如 BBR + CUBIC 共存），BBR 会抢占更多其他软件的带宽，
          # 降低其他应用的公平性（如后台软件更新影响前台视频播放）。
          # 因此 Android 默认仍使用 CUBIC。开启 BBR 前请考虑自己是否真的有使用必要。
          ####################################################################
          cfg CONFIG_TCP_CONG_BBR y
          # CUBIC：安卓默认算法，吞吐量/稳定性/兼容性/能效平衡最好
          cfg CONFIG_TCP_CONG_CUBIC y
          # VEGAS：基于时延的拥塞控制算法
          cfg CONFIG_TCP_CONG_VEGAS y
          # New Vegas：Vegas 改进版
          cfg CONFIG_TCP_CONG_NV y
          # Westwood+：基于带宽估计，适合无线网络
          cfg CONFIG_TCP_CONG_WESTWOOD y
          # HTCP：面向高延迟高速网络的算法
          cfg CONFIG_TCP_CONG_HTCP y
          # brutal：激进抢占吞吐量的算法，需要应用侧显式设置带宽才生效，
          # 绝大部分安卓应用不支持，故不要设为默认
          cfg CONFIG_TCP_CONG_BRUTAL y
          if [ "$BBR_MODE" = "default" ]; then
            echo "正在将BBR设为默认拥塞控制算法..."
            cfg CONFIG_DEFAULT_TCP_CONG bbr
          else
            cfg CONFIG_DEFAULT_TCP_CONG cubic
          fi

      - name: 启用 Droidspaces 容器支持
        if: inputs.droidspaces_enable != 'false'
        env:
          DROIDSPACES_MODE: ${{ inputs.droidspaces_enable }}
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.cfg.sh"
          echo "正在启用 Droidspaces 容器支持..."
          cd "$GITHUB_WORKSPACE/kernel_workspace/common"
          RAW="https://github.com/${GITHUB_REPOSITORY}/raw/refs/heads/${GITHUB_REF_NAME}/droidspaces_patch"

          fetch_patch() {  # fetch_patch <文件名>
            if wget -q "$RAW/$1" -O "$1"; then return 0; fi
            echo "::warning::未取到 $1，跳过该补丁"
            return 1
          }

          # 应用 Droidspaces 容器必须补丁
          if fetch_patch fix_sysvipc_kabi_6_7_8.patch; then
            patch -p1 -F 3 < fix_sysvipc_kabi_6_7_8.patch || echo "::warning::fix_sysvipc_kabi 未完全应用"
          fi
          # 修补 oplus_bsp_midas 行为，避免开机崩溃
          if fetch_patch fix_oplus_bsp_midas.patch; then
            patch -p1 -F 3 < fix_oplus_bsp_midas.patch || echo "::warning::fix_oplus_bsp_midas 未完全应用"
          fi
          # 应用 NTSync 补丁
          if fetch_patch ntsync_base.patch; then
            patch -p1 -F 3 < ntsync_base.patch || echo "::warning::ntsync_base 未完全应用"
          fi
          if fetch_patch "ntsync_compat_${ANDROID_VERSION}-${KERNEL_VERSION}.patch"; then
            patch -p1 -F 3 < "ntsync_compat_${ANDROID_VERSION}-${KERNEL_VERSION}.patch" \
              || echo "::warning::ntsync_compat 未完全应用"
          fi

          # 开启 Droidspaces 容器所需内核支持
          cfg CONFIG_PID_NS y
          cfg CONFIG_IPC_NS y
          cfg CONFIG_USER_NS y
          cfg CONFIG_SYSVIPC y
          cfg CONFIG_DEVTMPFS y
          cfg CONFIG_NAMESPACES y
          cfg CONFIG_POSIX_MQUEUE y
          cfg CONFIG_NETFILTER_XT_MATCH_ADDRTYPE y
          cfg CONFIG_NETFILTER_XT_TARGET_LOG y
          cfg CONFIG_NETFILTER_XT_MATCH_RECENT y
          # 未经测试的配置选项，可能导致bug
          # cfg CONFIG_CGROUP_DEVICE y
          # cfg CONFIG_CGROUP_PIDS y
          # cfg CONFIG_FW_LOADER_COMPRESS y
          # cfg CONFIG_BRIDGE_NETFILTER y
          # cfg CONFIG_NF_TABLES y
          # 开启 NTSync
          cfg CONFIG_NTSYNC y

          if [ "$DROIDSPACES_MODE" = "extend" ]; then
            echo "正在启用容器环境扩展支持..."
            # 开启虚拟 HCI 设备支持
            cfg CONFIG_BT_HCIVHCI y
            # 开启 systemd-coredump 支持
            cfg CONFIG_STATIC_USERMODEHELPER n
            # 添加 Lindroid EVDI DRM 驱动
            if fetch_patch evdi_drm.patch; then
              patch -p1 -F 3 < evdi_drm.patch || echo "::warning::evdi_drm 未完全应用"
            fi
            cfg CONFIG_DRM_LINDROID_EVDI y
          fi

      - name: 启用ADIOS IO调度器
        if: inputs.adios_enable
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.cfg.sh"
          echo "正在启用ADIOS IO调度器(截止时间优先调度 + 自适应延迟控制)…"
          cd "$GITHUB_WORKSPACE/kernel_workspace/common"
          # 【修复】原流程只往 defconfig 塞 CONFIG_MQ_IOSCHED_ADIOS，但本树 block/Kconfig.iosched
          # 里只有 MQ_IOSCHED_DEADLINE / MQ_IOSCHED_KYBER —— 没有源码补丁时这两个符号是空操作，
          # 刷进去的包会在发布页谎报「已支持 ADIOS」。这里先尝试补丁，再校验符号是否存在。
          if wget -q "https://github.com/${GITHUB_REPOSITORY}/raw/refs/heads/${GITHUB_REF_NAME}/other_patch/adios-${KERNEL_VERSION}.patch" \
               -O adios.patch 2>/dev/null; then
            patch -p1 -F 3 < adios.patch || echo "::warning::adios 补丁未完全应用"
          fi
          if cfg_require MQ_IOSCHED_ADIOS "ADIOS IO调度器"; then
            cfg CONFIG_MQ_IOSCHED_ADIOS y
            cfg CONFIG_MQ_IOSCHED_DEFAULT_ADIOS y
          fi

      - name: 启用Re-Kernel支持
        if: inputs.rekernel_enable
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.cfg.sh"
          echo "正在启用Re-Kernel支持(与Freezer/NoActive等软件配合,提升冻结后台能力)…"
          cd "$GITHUB_WORKSPACE/kernel_workspace/common"
          # 【修复】同上：没有补丁时 CONFIG_REKERNEL 在内核树里根本不存在
          if wget -q "https://github.com/${GITHUB_REPOSITORY}/raw/refs/heads/${GITHUB_REF_NAME}/other_patch/rekernel-${KERNEL_VERSION}.patch" \
               -O rekernel.patch 2>/dev/null; then
            patch -p1 -F 3 < rekernel.patch || echo "::warning::rekernel 补丁未完全应用"
          fi
          if cfg_require REKERNEL "Re-Kernel"; then
            cfg CONFIG_REKERNEL y
          fi

      - name: 启用内核级基带保护
        if: inputs.baseband_guard
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.cfg.sh"
          echo "正在启用内核级基带保护支持…"
          cfg CONFIG_BBG y
          cd "$GITHUB_WORKSPACE/kernel_workspace/common"
          curl -fsSL "https://github.com/cctv18/Baseband-guard/raw/master/setup.sh" | bash
          # 【修复】原来用 /^config LSM$/,/^help$/ 做区间，但本树 security/Kconfig 里 help 是
          # tab 缩进的，^help$ 永远匹配不到 —— 区间会一路吃到文件末尾，后面的 default 行可能被误改。
          # 这里改成匹配「可选空白 + help」，并且用 \b 精确替换 selinux 词。
          sed -i '/^config LSM$/,/^[[:space:]]*help$/ { /^[[:space:]]*default/ { /baseband_guard/! s/\bselinux\b/selinux,baseband_guard/ } }' security/Kconfig
          grep -n 'baseband_guard' security/Kconfig | head -n 5 || true

      - name: 设置内核版本后缀
        env:
          KERNEL_SUFFIX_IN: ${{ inputs.kernel_suffix }}
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.cfg.sh"

          # 【修复】内核后缀是自由文本输入，原来直接拼进 sed 双引号里：
          # 带 / & | 会写坏 sed，带 ' 就能跳出引号注入命令。这里先做白名单校验。
          SUFFIX="$KERNEL_SUFFIX_IN"
          if [ -n "$SUFFIX" ]; then
            case "$SUFFIX" in
              -*)
                echo "::error::kernel_suffix 开头不要加连字符：$SUFFIX"
                exit 1
                ;;
            esac
            if ! printf '%s' "$SUFFIX" | grep -qE '^[A-Za-z0-9._+-]+$'; then
              echo "::error::kernel_suffix 只允许字母、数字、点、下划线、加号、连字符：$SUFFIX"
              exit 1
            fi
            echo "使用自定义内核版本后缀：-$SUFFIX"
          else
            SUFFIX="${KERNEL_NAME}"
            echo "使用默认内核版本后缀：-$SUFFIX"
          fi

          # 版本串唯一来源：CONFIG_LOCALVERSION（本树 gki_defconfig 里原本是 CONFIG_LOCALVERSION="-4k"）
          cfg CONFIG_LOCALVERSION "\"-$SUFFIX\""
          cfg CONFIG_LOCALVERSION_AUTO n

          echo "当前 defconfig 中的版本相关配置："
          grep -nE '^CONFIG_LOCALVERSION' "$DEFCONFIG" || true

      - name: 集成 NoMount（v2.2.0）
        env:
          NOMOUNT_REF: ${{ vars.NOMOUNT_REF || 'v2.2.0' }}
          # y = 编进内核(Image 内置) / m = 编成 LKM / none = 跳过本步骤
          NOMOUNT_MODE: y
        run: |
          set -uo pipefail
          . "$GITHUB_WORKSPACE/.cfg.sh"
          echo "===== 集成 NoMount ref=$NOMOUNT_REF mode=$NOMOUNT_MODE ====="
          if [ "$NOMOUNT_MODE" = "none" ]; then
            echo "已按配置跳过 NoMount"
            exit 0
          fi

          cd "$GITHUB_WORKSPACE/kernel_workspace"
          echo "工作目录: $(pwd)"
          ls -d common/fs >/dev/null 2>&1 || { echo "::error::找不到内核树 common/fs"; exit 1; }

          SCRIPT=/tmp/setup_nomount.sh
          rm -f "$SCRIPT"
          OK=0
          for URL in \
            "https://raw.githubusercontent.com/maxsteeel/nomount/$NOMOUNT_REF/kernel/setup.sh" \
            "https://cdn.jsdelivr.net/gh/maxsteeel/nomount@$NOMOUNT_REF/kernel/setup.sh" \
            "https://gcore.jsdelivr.net/gh/maxsteeel/nomount@$NOMOUNT_REF/kernel/setup.sh" \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/.github/scripts/setup_nomount.sh" \
          ; do
            echo "----- 尝试下载: $URL"
            if timeout 90 wget --tries=3 --timeout=30 --server-response "$URL" -O "$SCRIPT" 2>/tmp/wget.err \
               && [ -s "$SCRIPT" ] && head -n 1 "$SCRIPT" | grep -q '^#!'; then
              OK=1
              echo "下载成功：$(wc -c < "$SCRIPT") 字节"
              break
            fi
            echo "该源不可用，原因（wget 响应）："
            grep -Ei "HTTP/|ERROR|refused|not found|timed out" /tmp/wget.err | tail -n 3 | sed 's/^/    /' || true
            rm -f "$SCRIPT"
          done

          if [ "$OK" != "1" ]; then
            echo "::error::所有源都拿不到 NoMount 集成脚本，请确认 NOMOUNT_REF=$NOMOUNT_REF 是否存在于 maxsteeel/nomount"
            exit 8
          fi

          echo "----- 安装 NoMount 到内核树"
          bash "$SCRIPT" "$NOMOUNT_REF" || { echo "::error::setup.sh 执行失败"; exit 1; }

          echo "----- 校验补丁结果"
          test -e common/fs/nomount || { echo "::error::common/fs/nomount 未创建"; exit 1; }
          grep -n "nomount" common/fs/Makefile || true
          grep -n "fs/nomount/Kconfig" common/fs/Kconfig || true
          ls -ld NoMount common/fs/nomount || true

          # NoMount 用 register_key_type() 存规则，6.6 树里 CONFIG_KEYS 默认是 n，
          # 不开会直接编译报错：struct key_type 未定义。这里一并补上。
          cfg "CONFIG_NOMOUNT" "$NOMOUNT_MODE"
          cfg CONFIG_KEYS y
          cfg CONFIG_ASSOCIATIVE_ARRAY y
          grep -nE '^CONFIG_(NOMOUNT|KEYS|ASSOCIATIVE_ARRAY)=' "$DEFCONFIG" || true
          echo "===== NoMount 集成完成 ====="

      - name: 构建内核
        run: |
          set -eo pipefail
          WORKDIR="$(pwd)"
          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKDIR/kernel_workspace/clang18/bin:$PATH"
          export PATH="$WORKDIR/kernel_workspace/build-tools/bin:$PATH"
          CLANG_DIR="$WORKDIR/kernel_workspace/clang18/bin"
          CLANG_VERSION="$("$CLANG_DIR/clang" --version | head -n 1)"
          LLD_VERSION="$("$CLANG_DIR/ld.lld" --version | head -n 1)"
          echo "编译器信息:"
          echo "Clang版本: $CLANG_VERSION"
          echo "LLD版本: $LLD_VERSION"
          pahole_version=$(pahole --version 2>/dev/null | head -n1); [ -z "$pahole_version" ] && echo "pahole版本：未安装" || echo "pahole版本：$pahole_version"

          mkdir -p "${CCACHE_DIR}"
          export CCACHE_LOGFILE="$WORKDIR/kernel_workspace/ccache.log"
          export CCACHE_COMPILERCHECK="none"
          export CCACHE_BASEDIR="${{ github.workspace }}"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_DIR="${CCACHE_DIR}"
          export CCACHE_MAXSIZE="3G"
          # 【修复】反复 append 会在缓存里堆叠重复的 sloppiness 行，先删后写
          sed -i '/^sloppiness[[:space:]]*=/d' "$CCACHE_DIR/ccache.conf" 2>/dev/null || true
          printf 'sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros\n' >> "$CCACHE_DIR/ccache.conf"

          cd kernel_workspace/common

          # ========== 修复 clang r510928 编译 dtc / libfdt 时的 -Werror 报错 ==========
          # 现象：scripts/dtc/dtc-parser.tab.c: error: assigning to 'char *' from 'const char *'
          #       discards qualifiers [-Werror,-Wincompatible-pointer-types-discards-qualifiers]
          # 原因：新版 clang 把这条诊断当成 error，而 host 工具(dtc/fdtoverlay/resolve_btfids/objtool)
          #       走的是 HOSTCFLAGS，不受 KCFLAGS 影响，所以内核侧的 -Wno-error 管不到它。
          echo "内核树版本: $(sed -n '1,5p' Makefile | tr '\n' ' ')"
          echo "dtc-parser.y 行数: $(wc -l < scripts/dtc/dtc-parser.y 2>/dev/null || echo 0)"
          export HOSTCFLAGS="-Wno-error -Wno-incompatible-pointer-types-discards-qualifiers"
          export HOSTCXXFLAGS="-Wno-error"
          export USERCFLAGS="-Wno-error"
          echo "HOSTCFLAGS=$HOSTCFLAGS"
          # 再给 dtc 的每个 obj 单独兜底：hostc_flags 里 HOSTCFLAGS_<obj>.o 排在最后，
          # 用 -w 直接静默 host 工具的全部警告（dtc/fdtoverlay 这类小工具静默无副作用）
          if [ -f scripts/dtc/Makefile ]; then
            for OBJ in dtc dtc-lexer.lex.o dtc-parser.tab.o flattree.o fstree.o data.o livetree.o \
                       treesource.o srcpos.o checks.o util.o fdtoverlay.o libfdt/fdt.o libfdt/fdt_ro.o \
                       libfdt/fdt_wip.o libfdt/fdt_sw.o libfdt/fdt_rw.o libfdt/fdt_strerror.o \
                       libfdt/fdt_empty_tree.o libfdt/fdt_addresses.o libfdt/fdt_overlay.o; do
              printf 'HOSTCFLAGS_%s += -w\n' "$OBJ" >> scripts/dtc/Makefile
            done
            echo "已为 scripts/dtc 的 host obj 注入 -w（静默 host 工具警告）"
          else
            echo "::warning::未找到 scripts/dtc/Makefile，跳过 dtc host 参数注入"
          fi
          # ======================================================================

          wget -q "https://github.com/${GITHUB_REPOSITORY}/raw/refs/heads/${GITHUB_REF_NAME}/lib/libfakestat.so" -O libfakestat.so
          wget -q "https://github.com/${GITHUB_REPOSITORY}/raw/refs/heads/${GITHUB_REF_NAME}/lib/libfaketimeMT.so" -O libfaketimeMT.so
          chmod 755 ./libfakestat.so ./libfaketimeMT.so
          export FAKESTAT="2025-05-25 12:00:00"
          export FAKETIME="@2025-05-25 13:00:00"
          echo "FAKESTAT=$FAKESTAT" >> "$GITHUB_ENV"
          echo "FAKETIME=$FAKETIME" >> "$GITHUB_ENV"
          SO_DIR=$(pwd)
          export PRELOAD_LIBS="$SO_DIR/libfakestat.so $SO_DIR/libfaketimeMT.so"

          # 创建 CC (编译器) 包装器
          printf '#!/bin/bash\nexport LD_PRELOAD="%s"\nexport FAKESTAT="%s"\nexport FAKETIME="%s"\nccache clang "$@"\n' \
            "$PRELOAD_LIBS" "$FAKESTAT" "$FAKETIME" > cc-wrapper
          # 创建 LD (链接器) 包装器
          printf '#!/bin/bash\nexport LD_PRELOAD="%s"\nexport FAKESTAT="%s"\nexport FAKETIME="%s"\nld.lld "$@"\n' \
            "$PRELOAD_LIBS" "$FAKESTAT" "$FAKETIME" > ld-wrapper
          chmod +x cc-wrapper ld-wrapper

          # 时间劫持自检
          echo "--- [Wrapper Test] 正在创建通用的时间劫持测试脚本 ---"
          printf '#!/bin/bash\nexport LD_PRELOAD="%s"\nexport FAKESTAT="%s"\nexport FAKETIME="%s"\necho ">>> Wrapper 内部环境检查完毕."\nexec "$@"\n' \
            "$PRELOAD_LIBS" "$FAKESTAT" "$FAKETIME" > test-wrapper.sh
          chmod +x test-wrapper.sh
          echo "--- [Wrapper Test] 正在测试 (date) 命令 ---"
          ./test-wrapper.sh date
          echo "--- [Wrapper Test] 正在测试 (stat) 命令 ---"
          ./test-wrapper.sh stat ./Makefile
          echo "--- [Wrapper Test] 测试完毕 ---"
          echo "--- 编译前环境时间: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"
          echo "--- 编译前环境文件时间戳: ---"
          LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile

          # 在构建内核的同时清除不必要的 .NET / Android NDK / Haskell / CodeQL 运行库，清理空间
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &

          JOBS="$(nproc --all)"
          echo "并行度: $JOBS"
          make -j"$JOBS" LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD="ld.lld" HOSTLD=ld.lld O=out \
            KCFLAGS+=-O2 KCFLAGS+=-Wno-error gki_defconfig
          make -j"$JOBS" LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="$SO_DIR/cc-wrapper" LD="$SO_DIR/ld-wrapper" HOSTLD=ld.lld O=out \
            KCFLAGS+=-O2 KCFLAGS+=-Wno-error Image

          echo "--- 编译后环境时间: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"
          echo "--- 编译后环境文件时间戳: ---"
          LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile
          echo "内核编译完成！实际 kernelrelease："
          cat out/include/config/kernel.release || true
          echo "ccache状态："
          ccache -s
          echo "编译后空间:"
          df -h

      - name: 保存新的 ccache 缓存
        if: inputs.ccache_update || steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CCACHE_REAL_KEY }}-${{ runner.os }}-${{ github.ref_name }}

      - name: 应用KPM并修补内核
        if: inputs.kpm_enable
        run: |
          set -euo pipefail
          echo "正在应用KP-N并修补内核..."
          cd kernel_workspace/common/out/arch/arm64/boot
          [ -f Image ] || { echo "::error::找不到待修补的 Image"; exit 1; }
          # KPatch-Next 的发布资产就是裸二进制 kptools-linux / kpimg-linux
          wget -q https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux -O kptools-linux
          wget -q https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux -O kpimg-linux
          chmod +x ./kptools-linux
          # kptools 用法：-p 修补 / -i 输入镜像 / -k kpimg / -o 输出镜像
          ./kptools-linux -p -i ./Image -k ./kpimg-linux -o ./oImage
          [ -s ./oImage ] || { echo "::error::kptools 未产出 oImage"; exit 1; }
          rm -f Image
          mv oImage Image
          echo "KPM 修补完成：$(stat -c %s Image) 字节"

      - name: 克隆 AnyKernel3 并打包
        id: create_zip
        env:
          KSU_TYPE: ${{ inputs.ksu_type }}
          LZ4KD_ENABLE: ${{ inputs.lz4kd_enable }}
          KPM_ENABLE: ${{ inputs.kpm_enable }}
          KERNEL_SUFFIX_IN: ${{ inputs.kernel_suffix }}
        run: |
          set -euo pipefail
          cd kernel_workspace
          rm -rf AnyKernel3
          git clone -q --depth=1 https://github.com/cctv18/AnyKernel3 AnyKernel3
          rm -rf ./AnyKernel3/.git
          cd AnyKernel3

          # 【修复】先确认源镜像存在再拷，原写法是拷完才 test，失败信息毫无意义
          SRC_IMAGE="../common/out/arch/arm64/boot/Image"
          [ -s "$SRC_IMAGE" ] || { echo "::error::未找到内核镜像 $SRC_IMAGE，构建可能出错"; exit 1; }
          install -m 0644 "$SRC_IMAGE" ./Image

          case "$KSU_TYPE" in
            sukisunova) KSU_TYPENAME="SukiSUNova" ;;
            bakasu)     KSU_TYPENAME="BakaSU" ;;
            ksunext)    KSU_TYPENAME="KSUNext" ;;
            ksu)        KSU_TYPENAME="KSU" ;;
            *)          KSU_TYPENAME="无内置KSU" ;;
          esac

          if [ "$LZ4KD_ENABLE" = "true" ]; then
            # 【修复】改成 github.com/.../raw/... 的规范写法，并对下载失败给出明确报错：
            # 原来一旦该文件不存在/分支改名，wget 只会静默失败，报错点跑到后面 zip 阶段，
            # 排查时很难看出是"少了个 zram.zip"。
            wget -q "https://github.com/${GITHUB_REPOSITORY}/raw/refs/heads/${GITHUB_REF_NAME}/zram.zip" -O zram.zip \
              || { echo "::error::下载 zram.zip 失败（检查仓库根目录是否存在该文件）"; exit 1; }
          fi
          if [ "$KPM_ENABLE" = "true" ]; then
            wget -q https://github.com/cctv18/KPatch-Next/releases/latest/download/kpn.zip -O kpn.zip \
              || { echo "::error::下载 kpn.zip 失败"; exit 1; }
          fi

          # ========== 生成自定义 AK3 文件名 ==========
          # 格式：(管理器名)内核版本【Root版本】【骁龙/天玑】(品牌).zip
          CLEAN_SUB_VERSION="${SUB_VERSION%_mtk}"
          CLEAN_SUB_VERSION="${CLEAN_SUB_VERSION%_gki}"

          if [ -n "$KERNEL_SUFFIX_IN" ]; then
            KERNEL_VER="${KERNEL_VERSION}.${CLEAN_SUB_VERSION}-${KERNEL_SUFFIX_IN}"
          else
            KERNEL_VER="${KERNEL_VERSION}.${CLEAN_SUB_VERSION}"
          fi

          if [[ "$SUB_VERSION" == *"mtk"* ]]; then
            PLATFORM="天玑"
          else
            PLATFORM="骁龙"
          fi

          ROOT_VER="${KSUVER:-无}"
          KSU_TYPENAME_FMT="${KSU_TYPENAME// /_}"
          AK3_NAME="(${KSU_TYPENAME_FMT})${KERNEL_VER}【${ROOT_VER}】【${PLATFORM}】(${BRAND_TAG}).zip"
          echo "生成 AK3 文件名：$AK3_NAME"
          # ==========================================

          zip -q -r "../$AK3_NAME" ./*

          if [ -n "$KERNEL_SUFFIX_IN" ]; then
            FULL_VERSION="${KERNEL_VERSION}.${CLEAN_SUB_VERSION}-${KERNEL_SUFFIX_IN}"
          else
            FULL_VERSION="${KERNEL_VERSION}.${CLEAN_SUB_VERSION}-${KERNEL_NAME}"
          fi
          TIME_NOW="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          {
            echo "Author: $GITHUB_ACTOR"
            echo "Repo: $GITHUB_REPOSITORY"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Time: $TIME_NOW"
            echo "Kernel Ver: $FULL_VERSION"
            echo "KSU Branch: ${KSU_TYPENAME}"
            echo "KSU Ver: ${KSUVER:-无}"
            echo "Support: ${SUPPORT_DEVICES}"
            echo "susfs: ${{ inputs.susfs_enable }}"
            echo "KPM: ${{ inputs.kpm_enable }}"
            echo "LZ4: ${{ inputs.lz4_enable }}"
            echo "LZ4KD: ${{ inputs.lz4kd_enable }}"
            echo "IPset: ${{ inputs.better_net }}"
            echo "BBR&Brutal: ${{ inputs.bbr_enable }}"
            echo "Droidspaces: ${{ inputs.droidspaces_enable }}"
            echo "ADIOS: ${{ inputs.adios_enable }}"
            echo "Re-Kernel: ${{ inputs.rekernel_enable }}"
            echo "BBG: ${{ inputs.baseband_guard }}"
          } > ./ak3.log
          zip -q -z "../$AK3_NAME" < ./ak3.log

          echo "ak3name=$AK3_NAME" >> "$GITHUB_OUTPUT"

      - name: 上传 Ccache 调试日志
        if: always() && inputs.ccache_debug
        uses: actions/upload-artifact@v7
        with:
          name: ccache-debug-log
          path: ${{ github.workspace }}/kernel_workspace/ccache.log
          if-no-files-found: ignore

      - name: 上传 ZIP 工件
        uses: actions/upload-artifact@v7
        with:
          # 【说明】archive: false 时 artifact 名取自文件名，这里与 ak3name 完全一致，
          # release job 才能按名字取回；一旦行为变化请同步改 download 侧。
          name: ${{ steps.create_zip.outputs.ak3name }}
          path: ${{ github.workspace }}/kernel_workspace/*.zip
          archive: false
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - name: 清理旧的工作区
        run: |
          set -euo pipefail
          rm -rf ./release_zips && mkdir -p ./release_zips

      - name: 下载 ZIP 工件
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.ak3name }}
          path: ./release_zips
          skip-decompress: true

      - name: 设置环境变量
        env:
          KSU_TYPE: ${{ inputs.ksu_type }}
          KERNEL_SUFFIX_IN: ${{ inputs.kernel_suffix }}
        run: |
          set -euo pipefail
          CLEAN_SUB_VERSION="${SUB_VERSION%_mtk}"
          CLEAN_SUB_VERSION="${CLEAN_SUB_VERSION%_gki}"

          if [ -n "$KERNEL_SUFFIX_IN" ]; then
            FULL_VERSION="${KERNEL_VERSION}.${CLEAN_SUB_VERSION}-${KERNEL_SUFFIX_IN}"
          else
            FULL_VERSION="${KERNEL_VERSION}.${CLEAN_SUB_VERSION}-${KERNEL_NAME}"
          fi
          echo "FULL_VERSION=$FULL_VERSION" >> "$GITHUB_ENV"

          TIME="$(TZ='Asia/Shanghai' date +'%y%m%d%H%M%S')"
          TIME_FORM="$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')"
          echo "TIME=$TIME" >> "$GITHUB_ENV"
          echo "TIME_FORM=$TIME_FORM" >> "$GITHUB_ENV"
          echo "TAG_HEAD=OPPO-OPlus-Realme-build" >> "$GITHUB_ENV"

          case "$KSU_TYPE" in
            sukisunova) KSU_TYPENAME="SukiSU Nova" ;;
            bakasu)     KSU_TYPENAME="BakaSU" ;;
            ksunext)    KSU_TYPENAME="KernelSU Next" ;;
            ksu)        KSU_TYPENAME="KernelSU (Official)" ;;
            *)          KSU_TYPENAME="无内置KSU" ;;
          esac
          echo "KSU_TYPENAME=$KSU_TYPENAME" >> "$GITHUB_ENV"

          if [[ "$SUB_VERSION" == *"mtk"* ]]; then
            echo "PLATFORM_NAME=天玑" >> "$GITHUB_ENV"
          else
            echo "PLATFORM_NAME=骁龙" >> "$GITHUB_ENV"
          fi

          echo "SUPPORT_DEVICES=$SUPPORT_DEVICES" >> "$GITHUB_ENV"
          echo "BRAND_TAG=$BRAND_TAG" >> "$GITHUB_ENV"
          echo "AK3_NAME=${{ needs.build.outputs.ak3name }}" >> "$GITHUB_ENV"

          # 工件必须恰好一个，多一个少一个都说明打包侧有问题
          COUNT=$(find ./release_zips -maxdepth 1 -type f -name '*.zip' | wc -l)
          echo "下载到的工件数量：$COUNT"
          ls -l ./release_zips
          [ "$COUNT" -eq 1 ] || { echo "::error::期望 1 个刷机包，实际 $COUNT 个"; exit 1; }

      - name: 创建发布
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat << 'EOF' > release_notes.md
          ### 📱 ${{ env.SUPPORT_DEVICES }} | ${{ env.KSU_TYPENAME }} 通用内核

          ## 📦 本次发布刷机包
          > **文件名**：`${{ env.AK3_NAME }}`

          ---

          - 支持机型：${{ env.SUPPORT_DEVICES }}
          - 平台：${{ env.PLATFORM_NAME }}
          - 内核版本号：${{ env.FULL_VERSION }}
          - 编译时间：${{ env.TIME_FORM }}
          - KSU 分支：${{ env.KSU_TYPENAME }}
          - susfs 支持：${{ inputs.susfs_enable }}
          - KPM 支持：${{ inputs.kpm_enable }}
          - LZ4 支持：${{ inputs.lz4_enable }}
          - LZ4KD 支持：${{ inputs.lz4kd_enable }}
          - 网络功能增强：${{ inputs.better_net }}
          - BBR/Brutal 等拥塞控制算法支持：${{ inputs.bbr_enable }}
          - Droidspaces 容器支持：${{ inputs.droidspaces_enable }}
          - IO 调度器支持(ADIOS)：${{ inputs.adios_enable }}
          - Re-Kernel 支持：${{ inputs.rekernel_enable }}
          - 内核级基带保护支持：${{ inputs.baseband_guard }}
          - BakaSU 管理器下载：[BakaSU_CI](https://github.com/cctv18/BakaSU_CI/releases)
          - SukiSU Ultra 管理器下载：[SukiSU-Ultra](https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases)
          - KernelSU Next 管理器下载：[KernelSU-Next](https://github.com/KernelSU-Next/KernelSU-Next/releases)
          - KSU 原版管理器下载：[KernelSU](https://github.com/tiann/KernelSU/releases)

          ### ⏫️ 更新内容：
          - 更新 ${{ env.KSU_TYPENAME }} 至最新版本（${{ needs.build.outputs.ksuver || '无' }}）
          - 构建脚本修复：版本后缀单一来源、defconfig 去重、补丁/下载失败改为显式报错、KSU 版本号取值兜底
          - (预留)

          ### 📋 安装方法 | Installation Guide
          1. 若你的手机已经安装了第三方Recovery（如TWRP)，可下载对应机型的AnyKernel刷机包后进入Recovery模式，通过Recovery刷入刷机包后重启设备；
          2. 若你的手机之前已有 root 权限，可在手机上安装[HorizonKernelFlasher](https://github.com/libxzr/HorizonKernelFlasher/releases)，在HorizonKernelFlasher中刷入AnyKernel刷机包并重启；
          3. 若你之前已刷入SukiSU Ultra内核，且SukiSU Ultra管理器已更新至最新版本，可在SukiSU Ultra管理器中直接刷入AnyKernel刷机包并重启；
          4. 刷入无lz4kd补丁版的内核前若刷入过lz4kd补丁版的内核，为避免出错，请先关闭zram模块；
          5. 由于KernelSU上游更新了元模块功能，最新版KSU管理器（包括除KernelSU Next以外的各分支）需要配合元模块(metamodule)才能正常挂载模块。目前的元模块包括[meta overlayfs](https://github.com/KernelSU-Modules-Repo/meta-overlayfs), [mountify](https://github.com/backslashxx/mountify), [meta magicmount](https://github.com/7a72/meta-magic_mount/), [meta magicmount rs](https://github.com/Tools-cx-app/meta-magic_mount/), [hybrid mount](https://github.com/YuzakiKokuban/meta-hybrid_mount)等。若你是第一次使用KSU或刚从旧版KSU管理器升级至新版，请先安装一个元模块，这样其他涉及系统挂载的模块才能正常运行；
          6. KernelPatch Next（即KPN）是一个独立于KSU的KPM实现，可以运行在任意KSU/面具环境中（不适用于Apatch），且不能与(Re)SukiSU内置的kpm功能共同使用，使用前请保证你的内核没有内置的kpm实现/修补。

          #### ※※※刷写内核有风险，为防止出现意外导致手机变砖，在刷入内核前请务必用[KernelFlasher](https://github.com/capntrips/KernelFlasher)等软件备份boot等关键启动分区!※※※
          EOF

          gh release create "${TAG_HEAD}-${BRAND_TAG}-${TIME}" \
            --repo "${{ github.repository }}" \
            --title "${TAG_HEAD}-${AK3_NAME}" \
            --notes-file release_notes.md \
            release_zips/*.zip
